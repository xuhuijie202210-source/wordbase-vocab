services:
  - type: web
    name: wordbase-vocab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: HOST=0.0.0.0 python server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wordbase-postgres
          property: connectionString

databases:
  - name: wordbase-postgres
    plan: free
